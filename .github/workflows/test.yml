name: Tests

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6.8.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint with ruff
        run: |
          uv run ruff check src/ tests/
          uv run ruff format --check src/ tests/

      - name: Run tests
        run: uv run pytest -v

  docker-build:
    name: Docker build (test stage + pytest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.staging.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q

      - name: Build test stage
        uses: docker/build-push-action@v6.15.0
        with:
          context: .
          target: test
          load: true
          tags: mcp-gway:test
          cache-from: type=gha,scope=test
          cache-to: type=gha,mode=max,scope=test

      - name: Run pytest inside the test image
        run: docker run --rm mcp-gway:test

      - name: Build runtime stage
        uses: docker/build-push-action@v6.15.0
        with:
          context: .
          target: runtime
          load: true
          tags: mcp-gway:local
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

      # Catches packaging regressions (e.g. an editable .pth pointing outside the
      # image) that a successful build alone would not surface.
      - name: Smoke-test the runtime image
        run: |
          docker run --rm mcp-gway:local --version
          docker run --rm --entrypoint python mcp-gway:local -c "import ssl, starlette, starlette.routing, uvicorn, starlark, mcp_gway; print('imports ok')"
          test "$(docker run --rm --entrypoint sh mcp-gway:local -c 'id -u')" = "1000"
