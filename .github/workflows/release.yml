name: Release

# Tag-only releaser. Pushing `vX.Y.Z` is the single release decision:
# verify version sync -> build -> publish to PyPI + npm -> create GitHub Release.
#
# Release process (manual, deterministic):
#   1. node scripts/bump-version.mjs <major|minor|patch>
#   2. Hand-write the CHANGELOG.md entry
#   3. git commit && git tag vX.Y.Z && git push origin vX.Y.Z
#      Push the tag explicitly: --follow-tags only pushes ANNOTATED tags and
#      this repo tags lightweight, so the release would silently not run.
#
# No workflow_run trigger by design: it double-published every release
# (once via Tests-success, once via the tag push). No semantic-release:
# versioning is owned by scripts/bump-version.mjs, this workflow verifies.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create GitHub Release + attach artifacts
  id-token: write # PyPI + npm trusted publishing (OIDC)

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    concurrency:
      group: release
      cancel-in-progress: false
    environment:
      name: pypi
      url: https://pypi.org/p/mcp-gway/

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify tag points at merged code
        run: |
          git fetch origin +master:refs/remotes/origin/master
          SHA="$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          git merge-base --is-ancestor "$SHA" origin/master || {
            echo "::error::tag $GITHUB_REF_NAME ($SHA) is not on master — releases only come from merged PR code"
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4.4.0
        with:
          # Pinned exact: npm trusted publishing requires npm >= 11.5.1, and
          # Node 22 does not ship it (22.23.3 bundles npm 10.9.9). 24.21.0 ships 11.19.0.
          node-version: "24.21.0"
          registry-url: "https://registry.npmjs.org"

      - name: Install uv
        uses: astral-sh/setup-uv@v6.8.0

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          test "$TAG" = "$PKG" || {
            echo "::error::tag v$TAG != package.json $PKG — bump first, then tag"
            exit 1
          }
          grep -q "__version__ = \"$TAG\"" src/mcp_gway/__init__.py || {
            echo "::error::src/mcp_gway/__init__.py drifts from tag v$TAG"
            exit 1
          }

      - name: Verify version sync
        run: node scripts/bump-version.mjs --check

      - name: Run test suite
        run: |
          uv sync --all-groups
          uv run ruff check src/ tests/
          uv run ruff format --check src/ tests/
          uv run pytest

      - name: Extract release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '/^## /{if(capture)exit; if(index($0,ver)){capture=1; next}} capture{print}' CHANGELOG.md | sed '/./,$!d' > release-notes.md
          test -s release-notes.md || {
            echo "::error::no CHANGELOG.md entry for $VERSION"
            exit 1
          }
          {
            echo "## mcp-gway $GITHUB_REF_NAME"
            echo
            cat release-notes.md
            echo
            echo "Install: \`pip install mcp-gway==$VERSION\`"
          } > release-notes.md.tmp && mv release-notes.md.tmp release-notes.md

      - name: Build distribution
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.13.0
        with:
          verbose: true

      - name: Publish to npm (OIDC trusted publishing)
        run: |
          npm -v
          npm publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.3.2
        with:
          body_path: release-notes.md
          files: dist/*
          generate_release_notes: false
