name: Release

# Tag-only releaser. Pushing `vX.Y.Z` is the single release decision:
# verify version sync -> build -> publish to PyPI -> create GitHub Release.
#
# Release process (manual, deterministic):
#   1. node scripts/bump-version.mjs <major|minor|patch>
#   2. Hand-write the CHANGELOG.md entry
#   3. git commit && git tag vX.Y.Z && git push --follow-tags
#
# No workflow_run trigger by design: it double-published every release
# (once via Tests-success, once via the tag push). No semantic-release:
# versioning is owned by scripts/bump-version.mjs, this workflow verifies.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create GitHub Release + attach artifacts
  id-token: write # PyPI trusted publishing (OIDC)

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    environment:
      name: pypi
      url: https://pypi.org/p/mcp-gway/

    steps:
      - name: Checkout
        uses: actions/checkout@v4 # v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4 # v4.4.0
        with:
          node-version: "22"

      - name: Install uv
        uses: astral-sh/setup-uv@v6 # v6.5.2
        with:
          enable-cache: true

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          test "$TAG" = "$PKG" || {
            echo "::error::tag v$TAG != package.json $PKG — bump first, then tag"
            exit 1
          }
          grep -q "__version__ = \"$TAG\"" src/mcp_gway/__init__.py || {
            echo "::error::src/mcp_gway/__init__.py drifts from tag v$TAG"
            exit 1
          }

      - name: Verify version sync
        run: node scripts/bump-version.mjs --check

      - name: Run test suite
        run: |
          uv sync --all-groups
          uv run ruff check src/ tests/
          uv run ruff format --check src/ tests/
          uv run pytest

      - name: Extract release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '/^## /{if(capture)exit; if(index($0,ver)){capture=1; next}} capture{print}' CHANGELOG.md | sed '/./,$!d' > release-notes.md
          test -s release-notes.md || {
            echo "::error::no CHANGELOG.md entry for $VERSION"
            exit 1
          }
          {
            echo "## mcp-gway $GITHUB_REF_NAME"
            echo
            cat release-notes.md
            echo
            echo "Install: \`pip install mcp-gway==$VERSION\`"
          } > release-notes.md.tmp && mv release-notes.md.tmp release-notes.md

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1 # v1.13.0
        with:
          verbose: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2 # v2.3.2
        with:
          body_path: release-notes.md
          files: dist/*
          generate_release_notes: false
