[project]
name = "mcp-gway"
version = "4.6.0"
description = "One MCP endpoint for every server your agent needs — Code Mode discovers schemas on demand."
readme = "README.md"
authors = [
    { name = "Deuri Vasquez", email = "deuriib@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.4.2",
    "htpy>=26.5.1",
    "httpx2>=2.12.0",
    "mcp>=2.0.0",
    "starlark-pyo3>=2026.1.1",
    "starlette>=1.6.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
mcp-gway = "mcp_gway.cli:main"
mgw = "mcp_gway.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.semantic_release]
commit_parser = "conventional"
tag_format = "v{version}"
commit_message = "chore(release-{version}): sync version surfaces + auto CHANGELOG entry"
commit_author = "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/mcp_gway/__init__.py:__version__"]
build_command = "node scripts/bump-version.mjs --write"
assets = [
    "package.json",
    "plugin.json",
    "uv.lock",
    "plugins/opencode/mcp-gateway.ts",
    "plugins/opencode/INSTALL.md",
    "plugins/antigravity/scripts/reinject.mjs",
    "plugins/antigravity/INSTALL.md",
    "plugins/pi/INSTALL.md",
    ".pi/extensions/mcp-gateway.ts",
    "rules/mcp-gway.md",
    "README.md",
    "AGENTS.md",
]

[tool.semantic_release.branches.main]
match = "(main|master)"
match_source = true

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "refactor", "revert", "style", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.changelog]
mode = "update"
exclude_commit_patterns = [
    '''chore(?:\([^)]*?\))?: .+''',
    '''ci(?:\([^)]*?\))?: .+''',
    '''build\((?!deps\): .+)''',
    '''Initial [Cc]ommit.*''',
]

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"

[tool.ruff.lint]
ignore = [
    "BLE001",  # Blind exception catching is intentional for graceful degradation
    "SIM117",  # Nested async with required by MCP library API
    "PYI063",  # Pydantic model_post_init has fixed signature
    "SIM102",  # Nested ifs with different error messages are clearer separate
    "B017",    # Tests intentionally catch broad exceptions
    "S110",    # try-except-pass intentional for resilience
    "S112",    # try-except-continue intentional
    "LOG015",  # logger warning intentional
    "RUF100",  # allow unused noqa
]

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
    "python-semantic-release>=10.0.0",
    "coverage[toml]>=7.16.0",
    "pytest-cov>=7.1.0",
]

[tool.coverage.run]
branch = true
source = ["src/mcp_gway"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
